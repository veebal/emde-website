project:
  type: website
  render:
    - index.qmd
    - methods.qmd
    - subscribe.qmd
    - about.qmd
    - "countries/*/index.qmd"
  resources:
    - "countries/**/*.csv"
    - "feeds/*.xml"
    - err_regimes_all.csv
    - err_status.csv

metadata-files:
  - _sidebar.yml

bibliography: err.bib

website:
  title: "Exchange rate regimes"
  navbar:
    logo: "XKDRORGFILES/XKDR_Logomark_RGB_Full_Colour.png"
    background: primary
    left:
      - href: index.qmd
        text: Home
      - href: methods.qmd
        text: Methodology
      - href: subscribe.qmd
        text: Subscribe
      - href: about.qmd
        text: About
    right:
      - icon: rss
        href: feeds/alerts.xml
        text: Alerts feed
  sidebar:
    style: "docked"
    background: light
  page-footer:
    left: "XKDR Forum."
    right: "[Alerts feed](feeds/alerts.xml) · [Revisions feed](feeds/revisions.xml)"

format:
  html:
    theme: default
    css: styles.css
    citations-hover: true
    link-citations: true
