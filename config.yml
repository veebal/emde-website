# ---------------------------------------------------------------------------
# EMDE website configuration. This is the only file you need to edit.
# After editing run:   julia --project=julia julia/build.jl   then   quarto render
# ---------------------------------------------------------------------------

# Settings applied to every country (override per country below).
defaults:
  start: 1995-01-01          # first date used in the regression
  end: null                  # null = latest available date
  numeraire: NZD             # neutral currency all rates are expressed against
  regressors: [USD, JPY, EUR, GBP]   # the country's own currency is dropped automatically
  frequency: weekly
  h: 26                      # minimum regime length (observations)
  breaks: 10                 # maximum number of breaks searched
  ic: BIC                    # information criterion for choosing the number of breaks

# BIS (WS_XRU) reference area for the numeraire and each regressor currency.
# USD is derived as 1 / numeraire and needs no entry.
anchor_areas:
  NZD: NZ
  JPY: JP
  EUR: XM
  GBP: GB

# BIS download: one small request per country/anchor, cached in data/raw/bis/. A cached file
# fetched today is reused; `--refresh-data` forces a download, `--offline` never downloads.
bis:
  from: 1990-01-01

# Countries. `code` is the BIS reference area (ISO2C), `iso3` the page folder, `ccy` the
# currency explained, `name` and `region` the labels on the home page and in the sidebar.
# This order is the row order on the landing page. Per-country overrides of `defaults`
# (for example `start: 2000-01-01` or `breaks: 8`) can be added to an entry.
