  - {label: "Global Financial Crisis (Sep 2008)", date: 2008-09-01}
  - {label: "Taper Tantrum (May 2013)", date: 2013-05-01}
  - {label: "COVID-19 Pandemic (Mar 2020)", date: 2020-03-01}
  - {label: "Russia-Ukraine War (Feb 2022)", date: 2022-02-01}
  - {label: "Trade War (Apr 2025)", date: 2025-04-01}

# Online change-point detection (Bayesian, Adams and MacKay 2007) on the same weekly
# returns as the dating. Hyperparameters are fixed numbers estimated once from the pooled
# dated regimes of all countries (empirical Bayes); they are not re-estimated at build time,
# so past probabilities never change. Order of coefficients: intercept, then the regressors.
bocpd:
  mu0:      [0.028723017554355176, 0.8492871168904051, 1.26133552646777e-14, 0.07565136409071652, 0.00024952785133330305]     # prior mean of (intercept, USD, JPY, EUR, GBP), from the lab (bocpd_prior.csv)
  prior_sd: [0.1380136981587279, 0.4768095105435485, 0.09293803158068946, 0.34765592021992153, 0.11355702676664692]     # prior standard deviation of each coefficient
  a0: 3.0                 # inverse-gamma shape for the residual variance
  b0: 0.6478429345100362              # inverse-gamma scale for the residual variance
  lambda: 208.60802469135803           # expected regime length in weeks (hazard = 1 / lambda)
  prune: 1.0e-10          # run lengths with less posterior mass than this are dropped
  ks: [4, 8, 13, 26, 52]  # horizons k for which P(change within the last k weeks) is reported
  alert:
    k: 26                 # an alert concerns a change within the last k weeks ...
    threshold: 0.5        # ... when its probability is at least this ...
    persist: 2            # ... for this many consecutive weeks;
    refractory: 26        # at most one alert per this many weeks
  dsm:
    c: 2.0                # likelihood weight 1 / (1 + (u/c)^2) on the standardised one-step residual u (robust engine)
  variance:               # two-sided CUSUM e-detector on the squared standardised one-step residual
    rho: 3.0              # alternative variance ratio: a fall to v/rho or a rise to rho*v
    alpha: 0.001923       # 1/520: average run length to a false alarm of at least ten years per direction
    ucap: 9.0             # cap on the squared standardised residual in the upward statistic
    window: 52            # reference variance: median squared residual over the preceding weeks / 0.4549
    claim: 26             # a variance alert claims the change lies within this many weeks
  status:
    recent_weeks: 26      # "New regime" / "Variance change" if an alert fired within this many weeks of the last observation
    stale_weeks: 52       # "Data ended" if a country's series stops this many weeks before the newest data

# Deployed address of the site, used for absolute links in the feeds. Leave empty until known.
site_url: ""

# Email sign-up. The site is static, so addresses are held by a newsletter service that sends each
# new feed entry by email (RSS-to-email). Buttondown is the default: create one newsletter per feed,
# set its RSS-to-email source to the feed address above, and put the newsletter usernames here.
# While they are empty the subscribe page shows the feed addresses only.
subscribe:
  service: buttondown
  alerts: ""              # Buttondown username of the alerts newsletter
  revisions: ""           # Buttondown username of the revisions newsletter

